name: ci
on: [push, pull_request]
# Least privilege: the jobs only read the code.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Tuned config keeps every detection
        run: python -m sysmontel data/captures/config-noisy.log data/captures/config-tuned.log
